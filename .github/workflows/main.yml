name: 构建 gptKHD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载仓库
        uses: actions/checkout@v4

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: 解压 Minecraft 工程
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "没有找到工程 ZIP 文件"
            exit 1
          fi

          echo "找到工程：$ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "工程文件："
          find project -maxdepth 3 -type f | head -100

      - name: 找到 Gradle 工程
        run: |
          set -e

          GRADLEW=$(find project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "没有找到 gradlew"
            echo "请检查上传的 ZIP 是否为完整工程"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "找到工程：$PROJECT_DIR"

          chmod +x "$GRADLEW"

      - name: 编译 Fabric 模组
        run: |
          cd "$PROJECT_DIR"
          ./gradlew build --no-daemon

      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: gptKHD-Fabric-1.21.1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
