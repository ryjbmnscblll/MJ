name: 构建 gptKHD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载仓库
        uses: actions/checkout@v4

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 解压工程
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "错误：没有找到工程 ZIP"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "工程内容："
          find project -maxdepth 2 -type f

      - name: 找到工程目录
        run: |
          set -e

          BUILD_FILE=$(find project -type f -name "build.gradle" -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "错误：没有找到 build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "工程目录：$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: 编译 Fabric 模组
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: gptKHD-Fabric-1.21.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
